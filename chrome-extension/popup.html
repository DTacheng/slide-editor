<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: white;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #e94560, #ff6b6b);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
    }
    .version {
      font-size: 11px;
      color: #888;
      margin-left: auto;
    }
    .status {
      background: rgba(255,255,255,0.05);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    .status-dot.inactive {
      background: #888;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-primary {
      background: #e94560;
      color: white;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .info {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }
    .shortcuts {
      margin-top: 8px;
    }
    .shortcut {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    kbd {
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📊</div>
    <div class="title">Slide Editor</div>
    <div class="version">v0.3.0</div>
  </div>

  <div class="status" id="status">
    <div class="status-dot inactive" id="statusDot"></div>
    <span id="statusText">Editor not active on this page</span>
  </div>

  <button class="btn btn-primary" id="enableBtn">Enable Editor</button>
  <button class="btn btn-secondary" id="disableBtn" disabled>Disable Editor</button>
  <button class="btn btn-secondary" id="exportBtn" disabled>Export HTML</button>

  <div class="info">
    <div class="shortcuts">
      <div class="shortcut"><span>Click</span> <kbd>Select</kbd></div>
      <div class="shortcut"><span>Drag</span> <kbd>Move</kbd></div>
      <div class="shortcut"><span>Double-click</span> <kbd>Edit text</kbd></div>
      <div class="shortcut"><span>Ctrl+Z</span> <kbd>Undo</kbd></div>
      <div class="shortcut"><span>Delete</span> <kbd>Remove</kbd></div>
      <div class="shortcut"><span>Esc</span> <kbd>Deselect</kbd></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
