<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
:root{--bg:#0f1115;--ink:#f4f1ea;--accent:#e8b04b;}
body{margin:0;background:#222;}
.slide{position:relative;width:1280px;height:720px;margin:24px auto;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Georgia,serif;}
.reveal{opacity:0;animation:rise .6s ease forwards;}@keyframes rise{to{opacity:1;transform:none;}}
</style></head><body><div class="slides">
  <section class="slide">
    <h1 class="reveal" style="position:absolute;left:80px;top:72px;font-size:64px;">季度复盘</h1>
    <p class="reveal" style="position:absolute;left:80px;top:170px;width:560px;">本季度核心指标全面达成，增长来自三条产品线。</p>
    <div data-editable style="position:absolute;left:820px;top:150px;font-size:120px;font-weight:800;color:var(--accent);">1,280</div>
    <div data-editable style="position:absolute;left:820px;top:300px;font-size:20px;">月活用户（万）</div>
  </section>
  <section class="slide">
    <h2 style="position:absolute;left:80px;top:64px;">三大增长引擎</h2>
    <div class="card" data-editable style="position:absolute;left:80px;top:180px;width:340px;">检索精准度提升 40%</div>
    <div class="card" data-editable style="position:absolute;left:470px;top:180px;width:340px;">人均阅读耗时下降 55%</div>
    <div class="card" data-editable style="position:absolute;left:860px;top:180px;width:340px;">合同审查自动化 70%</div>
  </section>
</div></body></html>
